<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">Connect with Ashish</title><desc id="desc">Confirmed LinkedIn and GitHub links</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#101b31"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
 <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#34445f" opacity=".5"/></pattern>
 <style>
 text{font-family:Inter,Arial,sans-serif;fill:#f4f6fb} .muted{fill:#9aa9c2} .blue{fill:#247bff} .red{fill:#ff354f} .mono{font-family:ui-monospace,Consolas,monospace} .card{fill:#101b2d;stroke:#283955;stroke-width:1.5}
 .shine{animation:shine 5s ease-in-out infinite} .float{animation:float 5s ease-in-out infinite} .pulse{animation:pulse 4s ease-in-out infinite}
 @keyframes shine{0%,100%{transform:translateX(-120px);opacity:0}45%{opacity:.35}70%{transform:translateX(1100px);opacity:0}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
 @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
 @media (prefers-reduced-motion:reduce){.shine,.float,.pulse{animation:none}}
 
 </style>
</defs>
<rect width="1000" height="340" rx="24" fill="url(#bg)"/><rect width="1000" height="340" rx="24" fill="url(#dots)"/>
<rect x="0" y="0" width="1000" height="5" fill="url(#line)"/>

<text x="42" y="54" class="mono blue" font-size="14">04 / CONNECT</text>
<text x="42" y="101" font-size="34" font-weight="800">Let's connect.</text>
<text x="42" y="136" class="muted" font-size="16">Find me on the platforms below.</text>
<g class="float"><rect x="42" y="174" width="240" height="118" rx="18" class="card"/>
<circle cx="92" cy="219" r="22" fill="#247bff"/><text x="92" y="226" text-anchor="middle" font-size="20" font-weight="800">in</text>
<text x="128" y="216" font-size="17" font-weight="700">LinkedIn</text><text x="128" y="242" class="muted" font-size="12">itsashishdev</text>
<text x="62" y="274" class="mono blue" font-size="12">linkedin.com/in/itsashishdev</text></g>
<g class="float"><rect x="310" y="174" width="240" height="118" rx="18" class="card"/>
<circle cx="360" cy="219" r="22" fill="#ff354f"/><text x="360" y="226" text-anchor="middle" font-size="18" font-weight="800">GH</text>
<text x="396" y="216" font-size="17" font-weight="700">GitHub</text><text x="396" y="242" class="muted" font-size="12">ambanigaming0</text>
<text x="330" y="274" class="mono blue" font-size="12">github.com/ambanigaming0</text></g>
<g><rect x="590" y="174" width="365" height="118" rx="18" class="card"/>
<text x="614" y="210" font-size="17" font-weight="700">Pointing character</text>
<text x="614" y="238" class="muted" font-size="14">Replace AKG placeholder with</text>
<text x="614" y="260" class="muted" font-size="14">your transparent right_pointing.png</text></g>

</svg>