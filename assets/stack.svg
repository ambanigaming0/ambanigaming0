<g transform="translate(500 310)"><ellipse rx="360" ry="48" fill="none" stroke="#247bff" stroke-opacity=".7" stroke-width="2" transform="rotate(-6)"/><ellipse rx="290" ry="29" fill="none" stroke="#ff354f" stroke-opacity=".65" stroke-width="2" transform="rotate(7)"/><circle r="28" fill="#101d32" stroke="url(#neon)" stroke-width="2"/><text y="5" text-anchor="middle" font-size="12" font-weight="800">STACK</text><circle cx="-320" cy="-5" r="5" fill="#247bff" class="pulse"/><circle cx="280" cy="8" r="5" fill="#ff354f" class="pulse"/></g><text x="42" y="380" class="muted" font-size="12">Technology labels are suggestions to confirm, not verified skill claims.</text></svg>