<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc">
<title id="title">Technology stack</title><desc id="desc">Technology chips are marked for confirmation</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#101b31"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
 <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#34445f" opacity=".5"/></pattern>
 <style>
 text{font-family:Inter,Arial,sans-serif;fill:#f4f6fb} .muted{fill:#9aa9c2} .blue{fill:#247bff} .red{fill:#ff354f} .mono{font-family:ui-monospace,Consolas,monospace} .card{fill:#101b2d;stroke:#283955;stroke-width:1.5}
 .shine{animation:shine 5s ease-in-out infinite} .float{animation:float 5s ease-in-out infinite} .pulse{animation:pulse 4s ease-in-out infinite}
 @keyframes shine{0%,100%{transform:translateX(-120px);opacity:0}45%{opacity:.35}70%{transform:translateX(1100px);opacity:0}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
 @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
 @media (prefers-reduced-motion:reduce){.shine,.float,.pulse{animation:none}}
 
 </style>
</defs>
<rect width="1000" height="370" rx="24" fill="url(#bg)"/><rect width="1000" height="370" rx="24" fill="url(#dots)"/>
<rect x="0" y="0" width="1000" height="5" fill="url(#line)"/>

<text x="42" y="54" class="mono blue" font-size="14">02 / TOOLKIT</text>
<text x="42" y="101" font-size="34" font-weight="800">Tools I work with</text>
<text x="42" y="137" class="muted" font-size="16">Confirm your current stack before publishing specific skills.</text>
<g transform="translate(500 240)">
 <ellipse rx="345" ry="100" fill="none" stroke="#247bff" stroke-width="2" transform="rotate(-12)"/>
 <ellipse rx="290" ry="70" fill="none" stroke="#ff354f" stroke-width="2" transform="rotate(23)"/>
 <ellipse rx="225" ry="43" fill="none" stroke="#526986" stroke-width="2" transform="rotate(-34)"/>
 <circle r="53" fill="#111f36" stroke="url(#line)" stroke-width="3"/><text y="8" text-anchor="middle" font-size="18" font-weight="800">STACK</text>
 <g class="float"><rect x="-420" y="-14" width="130" height="38" rx="12" class="card"/><text x="-355" y="10" text-anchor="middle" font-size="14">Node.js*</text></g>
 <g class="float"><rect x="-205" y="-105" width="140" height="38" rx="12" class="card"/><text x="-135" y="-81" text-anchor="middle" font-size="14">MongoDB*</text></g>
 <g class="float"><rect x="130" y="-102" width="135" height="38" rx="12" class="card"/><text x="197" y="-78" text-anchor="middle" font-size="14">Docker*</text></g>
 <g class="float"><rect x="300" y="18" width="120" height="38" rx="12" class="card"/><text x="360" y="42" text-anchor="middle" font-size="14">Linux*</text></g>
</g>
<text x="42" y="330" class="muted" font-size="13">* Examples from prior technical context — confirm or remove before publishing.</text>

</svg>