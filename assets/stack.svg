<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="t d">
<title id="t">Technology Stack</title><desc id="d">Technology cards marked for confirmation</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050811"/><stop offset=".55" stop-color="#0a1426"/><stop offset="1" stop-color="#160c20"/></linearGradient><linearGradient id="neon"><stop stop-color="#247bff"/><stop offset=".5" stop-color="#8a55ff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#6c84a8" opacity=".28"/></pattern><style>
text{font-family:Inter,Arial,sans-serif;fill:#f4f7ff} .muted{fill:#a0aec6} .blue{fill:#58a0ff} .red{fill:#ff5268} .mono{font-family:ui-monospace,Consolas,monospace} .card{fill:#0e192b;stroke:#2b4162;stroke-width:1.4} .float{animation:float 4s ease-in-out infinite} .pulse{animation:pulse 2.6s ease-in-out infinite} .spin{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite} .scan{animation:scan 4.5s ease-in-out infinite} .swing{transform-box:fill-box;transform-origin:50% 0;animation:swing 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}} @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}} @keyframes spin{to{transform:rotate(360deg)}} @keyframes scan{0%{transform:translateX(-120%);opacity:0}20%{opacity:.55}70%{transform:translateX(150%);opacity:.2}100%{transform:translateX(150%);opacity:0}} @keyframes swing{0%,100%{transform:rotate(-1.7deg)}50%{transform:rotate(1.7deg)}} @media(prefers-reduced-motion:reduce){.float,.pulse,.spin,.scan,.swing{animation:none}}
</style></defs><rect width="1000" height="410" rx="24" fill="url(#bg)"/><rect width="1000" height="410" rx="24" fill="url(#dots)"/><rect width="1000" height="5" fill="url(#neon)"/>
<text x="42" y="49" class="mono blue" font-size="14">02 / TECH STACK</text><text x="42" y="92" font-size="32" font-weight="900">Tools &amp; technologies</text><text x="42" y="124" class="muted" font-size="15">Keep only technologies you actively use and can confidently discuss.</text>
