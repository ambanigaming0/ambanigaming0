<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Technology Stack — animated logo cards</title>
<desc id="desc">Dark navy and neon blue, purple and crimson technology stack cards with logos, tags, and animated glowing accents.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050811"/><stop offset=".55" stop-color="#0a1426"/><stop offset="1" stop-color="#160c20"/></linearGradient>
 <linearGradient id="neon"><stop stop-color="#247bff"/><stop offset=".52" stop-color="#9b55ff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
 <linearGradient id="blue"><stop stop-color="#247bff"/><stop offset="1" stop-color="#4bc7ff"/></linearGradient>
 <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#6c84a8" opacity=".25"/></pattern>
 <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 text{font-family:Inter,Arial,sans-serif;fill:#f4f7ff}.muted{fill:#a0aec6}.blueText{fill:#58a0ff}.mono{font-family:ui-monospace,Consolas,monospace}
 .tech{transform-box:fill-box;transform-origin:center;animation:float 4.6s ease-in-out infinite}
 .tech:nth-of-type(2){animation-delay:-.7s}.tech:nth-of-type(3){animation-delay:-1.4s}.tech:nth-of-type(4){animation-delay:-2.1s}
 .borderGlow{animation:borderPulse 3.5s ease-in-out infinite}.scan{animation:scan 5s ease-in-out infinite}
 .orbit{transform-box:fill-box;transform-origin:center;animation:orbit 12s linear infinite}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
 @keyframes borderPulse{0%,100%{stroke-opacity:.5}50%{stroke-opacity:1}}
 @keyframes scan{0%{transform:translateX(-120%);opacity:0}20%{opacity:.24}70%{transform:translateX(150%);opacity:0}100%{transform:translateX(150%);opacity:0}}
 @keyframes orbit{to{transform:rotate(360deg)}}
 @media(prefers-reduced-motion:reduce){.tech,.borderGlow,.scan,.orbit{animation:none}}
 </style>
</defs>
<rect width="1000" height="430" rx="24" fill="url(#bg)"/><rect width="1000" height="430" rx="24" fill="url(#dots)"/><rect width="1000" height="5" fill="url(#neon)"/>
<text x="42" y="47" class="mono blueText" font-size="14">02 / TECH STACK</text>
<text x="42" y="91" font-size="32" font-weight="900">Tools &amp; technologies</text>
<text x="42" y="122" class="muted" font-size="15">The tools behind my development &amp; hosting workflow</text>
<!-- Node.js -->
<g class="tech">
 <rect x="42" y="151" width="214" height="145" rx="18" fill="#0e192b" stroke="#2b4162" stroke-width="1.5" class="borderGlow"/>
 <path d="M42 174 Q42 151 65 151 H233" fill="none" stroke="#78c900" stroke-width="2.5" stroke-linecap="round"/>
 <path d="M76 185 L94 175 L112 185 L112 206 L94 216 L76 206 Z" fill="none" stroke="#83cd29" stroke-width="3" stroke-linejoin="round"/>
 <text x="128" y="197" font-size="18" font-weight="800">Node.js</text><text x="66" y="240" class="muted" font-size="12">JavaScript runtime</text>
 <rect x="66" y="255" width="78" height="24" rx="12" fill="#17301d" stroke="#83cd29" stroke-opacity=".6"/><text x="105" y="271" text-anchor="middle" font-size="11" fill="#a7e66e">RUNTIME</text>
</g>
<!-- MongoDB -->
<g class="tech">
 <rect x="270" y="151" width="214" height="145" rx="18" fill="#0e192b" stroke="#2b4162" stroke-width="1.5" class="borderGlow"/>
 <path d="M270 174 Q270 151 293 151 H461" fill="none" stroke="#47a248" stroke-width="2.5" stroke-linecap="round"/>
 <path d="M304 177 C299 191 300 205 311 216 C322 205 323 191 315 177 L311 169 Z" fill="#47a248"/><path d="M311 177 L311 217" stroke="#b7e3a7" stroke-width="1.5"/>
 <text x="334" y="197" font-size="18" font-weight="800">MongoDB</text><text x="294" y="240" class="muted" font-size="12">Document database</text>
 <rect x="294" y="255" width="80" height="24" rx="12" fill="#15301e" stroke="#47a248" stroke-opacity=".65"/><text x="334" y="271" text-anchor="middle" font-size="11" fill="#8ed68e">DATABASE</text>
</g>
<!-- Docker -->
<g class="tech">
 <rect x="498" y="151" width="214" height="145" rx="18" fill="#0e192b" stroke="#2b4162" stroke-width="1.5" class="borderGlow"/>
 <path d="M498 174 Q498 151 521 151 H689" fill="none" stroke="#2496ed" stroke-width="2.5" stroke-linecap="round"/>
 <g transform="translate(523 176)" fill="#2496ed"><rect x="0" y="0" width="10" height="9" rx="1"/><rect x="12" y="0" width="10" height="9" rx="1"/><rect x="24" y="0" width="10" height="9" rx="1"/><rect x="12" y="-11" width="10" height="9" rx="1"/><rect x="24" y="-11" width="10" height="9" rx="1"/><rect x="36" y="-11" width="10" height="9" rx="1"/><path d="M-2 12 H49 Q45 28 27 29 H14 Q3 27 -2 12Z"/></g>
 <text x="584" y="197" font-size="18" font-weight="800">Docker</text><text x="522" y="240" class="muted" font-size="12">Containers &amp; deployment</text>
 <rect x="522" y="255" width="92" height="24" rx="12" fill="#102a42" stroke="#2496ed" stroke-opacity=".65"/><text x="568" y="271" text-anchor="middle" font-size="11" fill="#78caff">CONTAINERS</text>
</g>
<!-- Linux -->
<g class="tech">
 <rect x="726" y="151" width="232" height="145" rx="18" fill="#0e192b" stroke="#2b4162" stroke-width="1.5" class="borderGlow"/>
 <path d="M726 174 Q726 151 749 151 H935" fill="none" stroke="#f6c744" stroke-width="2.5" stroke-linecap="round"/>
 <circle cx="761" cy="190" r="16" fill="#f6c744"/><ellipse cx="761" cy="199" rx="18" ry="10" fill="#f4f7ff"/><circle cx="755" cy="187" r="2" fill="#111827"/><circle cx="767" cy="187" r="2" fill="#111827"/><path d="M756 194 L761 198 L766 194" fill="none" stroke="#f97316" stroke-width="2"/>
 <text x="789" y="197" font-size="18" font-weight="800">Linux</text><text x="750" y="240" class="muted" font-size="12">Server operating system</text>
 <rect x="750" y="255" width="68" height="24" rx="12" fill="#302a18" stroke="#f6c744" stroke-opacity=".65"/><text x="784" y="271" text-anchor="middle" font-size="11" fill="#ffe28a">SERVER</text>
</g>
<!-- extra stack tags -->
<text x="42" y="331" class="mono muted" font-size="12">MORE TOOLS</text>
<g>
 <rect x="42" y="347" width="139" height="40" rx="12" fill="#111b2d" stroke="#2b4162"/><text x="61" y="372" font-size="14" font-weight="700" fill="#8899ff">PHP</text><text x="104" y="372" class="muted" font-size="12">Backend</text>
 <rect x="194" y="347" width="170" height="40" rx="12" fill="#111b2d" stroke="#2b4162"/><path d="M211 359 L220 355 L229 359 L229 369 L220 374 L211 369Z" fill="none" stroke="#ff2d55" stroke-width="1.7"/><text x="239" y="372" font-size="14" font-weight="700">Laravel</text>
 <rect x="377" y="347" width="163" height="40" rx="12" fill="#111b2d" stroke="#2b4162"/><circle cx="396" cy="367" r="7" fill="#4479a1"/><text x="410" y="372" font-size="14" font-weight="700">MySQL</text>
 <rect x="553" y="347" width="182" height="40" rx="12" fill="#111b2d" stroke="#2b4162"/><circle cx="573" cy="367" r="7" fill="#d97706"/><text x="587" y="372" font-size="14" font-weight="700">Redis</text>
 <rect x="748" y="347" width="210" height="40" rx="12" fill="#111b2d" stroke="#2b4162"/><circle cx="768" cy="367" r="7" fill="#e879f9"/><text x="782" y="372" font-size="14" font-weight="700">Git / GitHub</text>
</g>
<text x="42" y="410" class="muted" font-size="11">Remove any tool you don't actively use. Logos and labels are editable SVG elements.</text>
<!-- moving glow sweep -->
<rect x="42" y="151" width="916" height="145" rx="18" fill="url(#neon)" opacity=".1" class="scan" pointer-events="none"/>
</svg>