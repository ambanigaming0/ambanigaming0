<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">Technology Stack — Animated Orbits</title><desc id="desc">Dark neon technology cards with a moving circular orbit node.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050811"/><stop offset=".55" stop-color="#0a1426"/><stop offset="1" stop-color="#160c20"/></linearGradient>
 <linearGradient id="neon"><stop stop-color="#247bff"/><stop offset=".5" stop-color="#8a55ff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
 <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#6c84a8" opacity=".28"/></pattern>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 text{font-family:Inter,Arial,sans-serif;fill:#f4f7ff}.muted{fill:#a0aec6}.blue{fill:#58a0ff}.red{fill:#ff5268}.mono{font-family:ui-monospace,Consolas,monospace}.card{fill:#0e192b;stroke:#2b4162;stroke-width:1.4}
 .orbit{fill:none;stroke-width:2}.cardfloat{animation:float 4s ease-in-out infinite}.pulse{animation:pulse 2.6s ease-in-out infinite}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}} @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
 @media(prefers-reduced-motion:reduce){.cardfloat,.pulse,.moving-dot{animation:none}}
 </style>
</defs>
<rect width="1000" height="410" rx="24" fill="url(#bg)"/><rect width="1000" height="410" rx="24" fill="url(#dots)"/><rect width="1000" height="5" fill="url(#neon)"/>
<text x="42" y="49" class="mono blue" font-size="14">02 / TECH STACK</text><text x="42" y="92" font-size="32" font-weight="900">Tools &amp; technologies</text><text x="42" y="124" class="muted" font-size="15">Keep only technologies you actively use and can confidently discuss.</text>
<g class="cardfloat"><rect x="42" y="158" width="210" height="74" rx="15" class="card"/><text x="62" y="188" font-size="17" font-weight="800">Node.js</text><text x="62" y="212" class="muted" font-size="12">[confirm]</text></g>
<g class="cardfloat"><rect x="270" y="158" width="210" height="74" rx="15" class="card"/><text x="290" y="188" font-size="17" font-weight="800">MongoDB</text><text x="290" y="212" class="muted" font-size="12">[confirm]</text></g>
<g class="cardfloat"><rect x="498" y="158" width="210" height="74" rx="15" class="card"/><text x="518" y="188" font-size="17" font-weight="800">Docker / Linux</text><text x="518" y="212" class="muted" font-size="12">[confirm]</text></g>
<g class="cardfloat"><rect x="726" y="158" width="232" height="74" rx="15" class="card"/><text x="746" y="188" font-size="17" font-weight="800">PHP / Laravel</text><text x="746" y="212" class="muted" font-size="12">[confirm]</text></g>
<!-- Circular path: the glowing dot moves continuously around it. -->
<ellipse cx="500" cy="310" rx="350" ry="43" class="orbit" stroke="#247bff" stroke-opacity=".85" transform="rotate(-6 500 310)"/>
<ellipse cx="500" cy="310" rx="286" ry="28" class="orbit" stroke="#ff354f" stroke-opacity=".75" transform="rotate(7 500 310)"/>
<circle cx="500" cy="310" r="29" fill="#101d32" stroke="url(#neon)" stroke-width="2.5" filter="url(#glow)"/><text x="500" y="315" text-anchor="middle" font-size="12" font-weight="800">STACK</text>
<g class="moving-dot" filter="url(#glow)">
 <circle r="5.5" fill="#58a0ff"><animateMotion dur="7s" repeatCount="indefinite" rotate="auto"><mpath href="#orbitPath"/></animateMotion></circle>
</g>
<path id="orbitPath" d="M150 310 A350 43 -6 1 0 850 310 A350 43 -6 1 0 150 310" fill="none" stroke="none"/>
<g class="moving-dot" filter="url(#glow)"><circle r="4.5" fill="#ff5268"><animateMotion dur="5.5s" repeatCount="indefinite"><mpath href="#orbitPath2"/></animateMotion></circle></g>
<path id="orbitPath2" d="M214 310 A286 28 7 1 0 786 310 A286 28 7 1 0 214 310" fill="none" stroke="none"/>
<text x="42" y="380" class="muted" font-size="12">Technology labels are suggestions to confirm, not verified skill claims.</text>
</svg>