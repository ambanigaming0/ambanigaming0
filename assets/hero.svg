<text x="42" y="104" class="blue" font-size="20" font-weight="800">HELLO, I'M</text><text x="38" y="163" font-size="47" font-weight="900">ASHISH KUMAR GUPTA</text><rect x="42" y="185" width="5" height="61" rx="3" fill="#ff354f"/>
<text x="63" y="207" font-size="18" font-weight="700">Student <tspan class="red">/</tspan> Developer <tspan class="red">/</tspan> Hosting Business Owner</text><text x="63" y="236" class="muted" font-size="16">Founder · CEO · Owner · Developer — VisionHost</text>
