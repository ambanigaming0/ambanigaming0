<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">Ashish Kumar Gupta</title><desc id="desc">Student, developer and VisionHost hosting business owner</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#101b31"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
 <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#34445f" opacity=".5"/></pattern>
 <style>
 text{font-family:Inter,Arial,sans-serif;fill:#f4f6fb} .muted{fill:#9aa9c2} .blue{fill:#247bff} .red{fill:#ff354f} .mono{font-family:ui-monospace,Consolas,monospace} .card{fill:#101b2d;stroke:#283955;stroke-width:1.5}
 .shine{animation:shine 5s ease-in-out infinite} .float{animation:float 5s ease-in-out infinite} .pulse{animation:pulse 4s ease-in-out infinite}
 @keyframes shine{0%,100%{transform:translateX(-120px);opacity:0}45%{opacity:.35}70%{transform:translateX(1100px);opacity:0}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
 @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
 @media (prefers-reduced-motion:reduce){.shine,.float,.pulse{animation:none}}
 
 </style>
</defs>
<rect width="1000" height="360" rx="24" fill="url(#bg)"/><rect width="1000" height="360" rx="24" fill="url(#dots)"/>
<rect x="0" y="0" width="1000" height="5" fill="url(#line)"/>

<text x="48" y="48" class="mono muted" font-size="15">GITHUB PROFILE / ASHISH KUMAR GUPTA</text>
<text x="48" y="112" class="blue" font-size="19" font-weight="700">HELLO, WORLD.</text>
<text x="44" y="178" font-size="48" font-weight="900">ASHISH KUMAR GUPTA</text>
<rect x="48" y="202" width="7" height="48" rx="3" fill="#ff354f"/>
<text x="72" y="222" font-size="19" font-weight="700">Student · Developer · Hosting Business Owner</text>
<text x="72" y="250" class="muted" font-size="16">Founder / CEO / Owner / Developer — VisionHost</text>
<rect x="48" y="285" width="360" height="42" rx="12" fill="#111f36" stroke="#247bff"/>
<text x="68" y="311" class="mono" font-size="14">github.com/ambanigaming0</text>
<g class="float"><rect x="735" y="66" width="205" height="230" rx="24" class="card"/>
<circle cx="837" cy="143" r="52" fill="#172b49" stroke="#247bff" stroke-width="2"/>
<text x="837" y="154" text-anchor="middle" font-size="30" font-weight="800" class="blue">AKG</text>
<text x="837" y="224" text-anchor="middle" font-size="14" class="muted">PORTRAIT PLACEHOLDER</text>
<text x="837" y="252" text-anchor="middle" font-size="12" class="mono">Replace with id.png</text></g>
<rect x="0" y="0" width="1000" height="360" fill="url(#line)" opacity=".12" class="shine"/>

</svg>