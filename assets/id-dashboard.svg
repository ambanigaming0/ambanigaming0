<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">Ashish profile ID</title><desc id="desc">Stylized profile card with no personal portrait</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#101b31"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
 <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#34445f" opacity=".5"/></pattern>
 <style>
 text{font-family:Inter,Arial,sans-serif;fill:#f4f6fb} .muted{fill:#9aa9c2} .blue{fill:#247bff} .red{fill:#ff354f} .mono{font-family:ui-monospace,Consolas,monospace} .card{fill:#101b2d;stroke:#283955;stroke-width:1.5}
 .shine{animation:shine 5s ease-in-out infinite} .float{animation:float 5s ease-in-out infinite} .pulse{animation:pulse 4s ease-in-out infinite}
 @keyframes shine{0%,100%{transform:translateX(-120px);opacity:0}45%{opacity:.35}70%{transform:translateX(1100px);opacity:0}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
 @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
 @media (prefers-reduced-motion:reduce){.shine,.float,.pulse{animation:none}}
 
 </style>
</defs>
<rect width="1000" height="350" rx="24" fill="url(#bg)"/><rect width="1000" height="350" rx="24" fill="url(#dots)"/>
<rect x="0" y="0" width="1000" height="5" fill="url(#line)"/>

<text x="42" y="54" class="mono blue" font-size="14">03 / PROFILE ID</text>
<text x="42" y="101" font-size="34" font-weight="800">Developer identification</text>
<g class="float">
 <path d="M730 38 L730 76 Q730 96 750 96 L790 96 Q810 96 810 76 L810 38" fill="none" stroke="#8a9bb5" stroke-width="8"/>
 <rect x="695" y="78" width="150" height="220" rx="18" fill="#101b2d" stroke="url(#line)" stroke-width="3"/>
 <rect x="710" y="95" width="120" height="75" rx="10" fill="#172b49"/>
 <text x="770" y="140" text-anchor="middle" class="blue" font-size="28" font-weight="800">AKG</text>
 <text x="770" y="195" text-anchor="middle" font-size="14" font-weight="700">ASHISH KUMAR</text>
 <text x="770" y="215" text-anchor="middle" font-size="14" font-weight="700">GUPTA</text>
 <text x="770" y="239" text-anchor="middle" class="muted" font-size="11">VISIONHOST</text>
 <g fill="#f4f6fb"><rect x="716" y="257" width="3" height="22"/><rect x="722" y="257" width="2" height="22"/><rect x="728" y="257" width="5" height="22"/><rect x="737" y="257" width="2" height="22"/><rect x="743" y="257" width="4" height="22"/><rect x="751" y="257" width="2" height="22"/><rect x="757" y="257" width="6" height="22"/><rect x="767" y="257" width="2" height="22"/><rect x="773" y="257" width="3" height="22"/><rect x="780" y="257" width="2" height="22"/><rect x="786" y="257" width="5" height="22"/><rect x="795" y="257" width="2" height="22"/><rect x="802" y="257" width="4" height="22"/></g>
</g>
<text x="42" y="155" font-size="20" font-weight="700">Ashish Kumar Gupta</text>
<text x="42" y="190" class="muted" font-size="16">Student · Developer · Hosting Business Owner</text>
<text x="42" y="220" class="muted" font-size="16">VisionHost — Founder / CEO / Owner / Developer</text>
<rect x="42" y="254" width="520" height="48" rx="12" class="card"/>
<text x="62" y="283" class="mono" font-size="14">Verified metrics: omitted until supplied</text>
<rect x="0" y="0" width="1000" height="350" fill="url(#line)" opacity=".1" class="shine"/>

</svg>