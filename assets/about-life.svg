<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">About Ashish — VisionHost and Night Club</title><desc id="desc">Animated about section with profile cards and Discord server tiles.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050811"/><stop offset=".55" stop-color="#0a1426"/><stop offset="1" stop-color="#160c20"/></linearGradient>
 <linearGradient id="neon"><stop stop-color="#247bff"/><stop offset=".5" stop-color="#8a55ff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
 <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#6c84a8" opacity=".28"/></pattern>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 text{font-family:Inter,Arial,sans-serif;fill:#f4f7ff}.muted{fill:#a0aec6}.blue{fill:#58a0ff}.red{fill:#ff5268}.mono{font-family:ui-monospace,Consolas,monospace}.card{fill:#0e192b;stroke:#2b4162;stroke-width:1.4}
 .float{animation:float 4.2s ease-in-out infinite}.float2{animation:float 4.2s ease-in-out -2.1s infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}.shine{animation:shine 5s ease-in-out infinite}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}} @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}} @keyframes shine{0%{transform:translateX(-130%);opacity:0}20%{opacity:.4}70%{transform:translateX(130%);opacity:0}100%{transform:translateX(130%);opacity:0}}
 @media(prefers-reduced-motion:reduce){.float,.float2,.pulse,.shine{animation:none}}
 </style>
</defs>
<rect width="1000" height="430" rx="24" fill="url(#bg)"/><rect width="1000" height="430" rx="24" fill="url(#dots)"/><rect width="1000" height="5" fill="url(#neon)"/>
