<g class="float2"><rect x="500" y="145" width="458" height="112" rx="18" class="card"/><rect x="500" y="145" width="5" height="112" rx="2" fill="#ff354f"/><text x="524" y="177" class="red" font-size="15" font-weight="800">DEVELOPER PROFILE</text><text x="524" y="204" font-size="14">GitHub: ambanigaming0</text><text x="524" y="230" class="muted" font-size="13">LinkedIn: itsashishdev</text></g>
<text x="42" y="293" class="mono muted" font-size="12">MY COMMUNITY</text>
<g class="float"><rect x="42" y="310" width="916" height="92" rx="18" fill="#120f20" stroke="#66304e" stroke-width="1.5"/><circle cx="87" cy="355" r="25" fill="#5865F2" filter="url(#glow)"/><text x="87" y="362" text-anchor="middle" font-size="21" font-weight="900">D</text>
<text x="128" y="344" font-size="17" font-weight="900">zZ. NIGHT CLUB 🔪</text><text x="128" y="368" class="muted" font-size="13">Socials · Hosting · Chill · Emotes</text>
<text x="570" y="341" class="mono red" font-size="11">SERVER ID</text><text x="570" y="359" class="mono" font-size="12">1162359083102384189</text><text x="570" y="382" class="mono muted" font-size="12">Owner: mr_ambanigaming · 289617999131049984</text>
<rect x="42" y="310" width="916" height="92" rx="18" fill="url(#neon)" opacity=".08" class="shine"/></g>
